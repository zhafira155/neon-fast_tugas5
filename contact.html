<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      body {
        background: radial-gradient(circle at top left, #4c1d95, #020617);
      }

      /* Glow hover input */
      .input-neon:focus {
        box-shadow:
          0 0 15px rgba(236, 72, 153, 0.6),
          0 0 30px rgba(168, 85, 247, 0.4);
      }
    </style>
  </head>

  <body class="min-h-screen flex items-center justify-center px-4 text-white">
    <section class="w-full max-w-5xl relative">
      <!-- CARD -->
      <div
        class="relative rounded-3xl p-10 overflow-hidden border border-white/10 bg-white/5 backdrop-blur-xl"
      >
        <!-- BACKGROUND GRADIENT -->
        <div
          class="absolute inset-0 bg-gradient-to-br from-purple-700/60 via-black/20 to-indigo-500/50"
        ></div>

        <!-- GLOW -->
        <div
          class="absolute -top-20 -left-20 w-72 h-72 bg-purple-500/30 blur-3xl rounded-full"
        ></div>
        <div
          class="absolute -bottom-20 -right-20 w-72 h-72 bg-pink-500/30 blur-3xl rounded-full"
        ></div>

        <!-- CONTENT -->
        <div class="relative z-10">
          <p class="text-center text-sm text-purple-300 mb-2">• CONTACT US</p>
          <h2 class="text-3xl font-bold text-center mb-10">Get in Touch</h2>

          <!-- FORM -->
          <div class="grid md:grid-cols-2 gap-6">
            <input
              type="email"
              placeholder="Email Address"
              class="input-neon w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 placeholder-gray-400 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 transition"
            />

            <input
              type="text"
              placeholder="Your Name"
              class="input-neon w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 placeholder-gray-400 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 transition"
            />

            <input
              type="text"
              placeholder="Phone Number"
              class="input-neon w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 placeholder-gray-400 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 transition"
            />

            <input
              type="text"
              placeholder="Enquiry Type"
              class="input-neon w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 placeholder-gray-400 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 transition"
            />
          </div>

          <!-- TEXTAREA -->
          <textarea
            placeholder="Message"
            class="input-neon mt-6 h-32 w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 placeholder-gray-400 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 transition"
          ></textarea>

          <!-- CHECKBOX -->
          <div class="flex items-center gap-2 mt-4 text-sm text-gray-300">
            <input type="checkbox" class="accent-pink-500" />
            <span>I agree to discuss my project</span>
          </div>

          <!-- BUTTON -->
          <div class="text-center mt-8">
            <a
              href="index.html"
              class="inline-block px-8 py-3 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 shadow-[0_0_20px_rgba(236,72,153,0.7)] hover:scale-105 transition"
            >
              Send Message →
            </a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
